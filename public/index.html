<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NVIEL</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #020617, #000000);
      font-family: Arial, sans-serif;
      color: #e5e7eb;
    }
    .box {
      width: 340px;
      padding: 30px;
      border-radius: 22px;
      background: rgba(15,23,42,0.9);
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 2px;
    }
    p {
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }
    button {
      margin-top: 24px;
      padding: 14px;
      width: 100%;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      background: linear-gradient(90deg,#6366f1,#22d3ee);
      color: #020617;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>NVIEL</h1>
    <p>Fourth-generation outcome-based ecosystem</p>
    <button onclick="alert('Outcome unlocked 🚀')">
      Experience the future
    </button>
    <p style="margin-top:16px;font-size:11px;">
      Built with vision, not money
    </p>
  </div>
</body>
</html>
