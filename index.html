<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVIEL</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:#020617;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* SCREENS */
.screen{
  position:fixed;
  inset:0;
  display:none;
}
.show{display:flex}

/* LOCK */
#lock{
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
#time{
  font-size:46px;
  font-weight:700;
}
#unlockHint{
  opacity:.6;
  margin-top:8px;
  font-size:14px;
}

/* HOME */
#home{
  flex-direction:column;
  padding:20px;
}
#brainStatus{
  opacity:.6;
  font-size:13px;
  margin-bottom:20px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.tile{
  background:#0b1020;
  border-radius:20px;
  padding:26px;
  text-align:center;
  font-size:16px;
}
.tile:active{transform:scale(.96)}

/* OUTCOME */
#outcome{
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:#000;
}
button{
  margin-top:24px;
  padding:14px 26px;
  border-radius:14px;
  border:none;
  font-weight:700;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lock" class="screen show">
  <div id="time"></div>
  <div id="unlockHint">Tap anywhere to unlock</div>
</div>

<!-- HOME SCREEN -->
<div id="home" class="screen">
  <h2>NVIEL</h2>
  <div id="brainStatus">Brain idle. Observing…</div>

  <div class="grid">
    <div class="tile" onclick="runOutcome('Call')">📞 Call</div>
    <div class="tile" onclick="runOutcome('Travel')">✈️ Travel</div>
    <div class="tile" onclick="runOutcome('Finance')">💸 Finance</div>
    <div class="tile" onclick="runOutcome('Focus')">🎯 Focus</div>
  </div>
</div>

<!-- OUTCOME SCREEN -->
<div id="outcome" class="screen"></div>

<script>
/* ===== TIME ===== */
const timeEl = document.getElementById("time");
function updateTime(){
  timeEl.innerText = new Date().toLocaleTimeString([],{
    hour:'2-digit',
    minute:'2-digit'
  });
}
updateTime();
setInterval(updateTime,1000);

/* ===== SCREENS ===== */
const lock=document.getElementById("lock");
const home=document.getElementById("home");
const out=document.getElementById("outcome");

/* ===== LIVE BRAIN (RULE BASED) ===== */
const brain={
  last:null,
  usage:{Call:0,Travel:0,Finance:0,Focus:0}
};

/* ===== UNLOCK ===== */
lock.onclick=function(){
  lock.style.display="none";
  home.classList.add("show");
};

/* ===== OUTCOME ENGINE ===== */
function runOutcome(name){
  brain.last=name;
  brain.usage[name]++;

  home.classList.remove("show");
  out.classList.add("show");

  out.innerHTML=
    "<div style='font-size:28px;font-weight:700'>"+name+" Outcome</div>"+
    "<div style='opacity:.6;margin-top:6px'>"+
    think()+"</div>"+
    "<button onclick='back()'>Back</button>";
}

function back(){
  out.classList.remove("show");
  home.classList.add("show");
}

/* ===== BRAIN THINKING ===== */
function think(){
  if(brain.last==="Call") return "Brain: Preparing communication context…";
  if(brain.last==="Focus") return "Brain: Reducing distractions…";
  if(brain.usage.Call>=3) return "Brain: You often call at this time.";
  return "Brain: Optimizing outcome experience…";
}

/* ===== BRAIN STATUS ===== */
setInterval(function(){
  const el=document.getElementById("brainStatus");
  if(brain.last){
    el.innerText="Brain active • Last outcome: "+brain.last;
  }else{
    el.innerText="Brain idle. Observing…";
  }
},1500);
</script>

</body>
</html>
