<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVIEL OS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:#020617;
  color:#e5e7eb;
  height:100vh;
  overflow:hidden;
}
.screen{
  position:absolute;
  inset:0;
  padding:20px;
  display:none;
}
.show{display:block}
.status{
  position:fixed;
  top:0;left:0;right:0;
  height:32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  font-size:12px;
  color:#94a3b8;
}
.lock{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.lock h1{font-size:48px;margin:0}
.home{
  padding-top:40px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:30px;
}
.app{
  text-align:center;
  font-size:12px;
}
.icon{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:18px;
  background:linear-gradient(145deg,#1e293b,#020617);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
  transition:.15s;
}
.app:active .icon{transform:scale(.92)}
.panel{
  margin-top:30px;
  padding:20px;
  border-radius:18px;
  background:#020617;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.outcome{
  font-size:22px;
  font-weight:600;
}
small{color:#94a3b8}
button{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#6366f1,#22d3ee);
  font-weight:700;
}
</style>
</head>

<body>

<div class="status">
  <span id="clock"></span>
  <span>📶 🔋</span>
</div>

<!-- LOCK -->
<div class="screen lock show" id="lock" onclick="go('home')">
  <h1 id="timeBig"></h1>
  <small>Tap to unlock</small>
</div>

<!-- HOME -->
<div class="screen home" id="home">
  <h2>NVIEL</h2>
  <small>Outcome-based OS</small>

  <div class="grid">
    <div class="app" onclick="launch('Focus')"><div class="icon">🎯</div>Focus</div>
    <div class="app" onclick="launch('Finance')"><div class="icon">💸</div>Finance</div>
    <div class="app" onclick="launch('Connect')"><div class="icon">📞</div>Connect</div>
    <div class="app" onclick="launch('Rest')"><div class="icon">🌙</div>Rest</div>
  </div>

  <div class="panel" id="panel">
    <div class="outcome">System idle</div>
    <small>Waiting for intent</small>
  </div>
</div>

<script>
const screens={
  lock:document.getElementById("lock"),
  home:document.getElementById("home")
};

function go(s){
  Object.values(screens).forEach(e=>e.classList.remove("show"));
  screens[s].classList.add("show");
}

function launch(type){
  const panel=document.getElementById("panel");
  panel.innerHTML=`
    <div class="outcome">${type} outcome activated</div>
    <small>System optimized for ${type.toLowerCase()}</small>
    <button onclick="go('home')">Done</button>
  `;
}

setInterval(()=>{
  const t=new Date();
  document.getElementById("clock").innerText=
    t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  document.getElementById("timeBig").innerText=
    t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
},1000);
</script>

</body>
</html>
