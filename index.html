<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NVIEL OS</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e5e7eb;
  height: 100vh;
  overflow: hidden;
}

/* LOCK SCREEN */
.lock {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity .5s ease;
}
.time {
  font-size: 48px;
  font-weight: 700;
}
.unlock {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.7;
}

/* HOME SCREEN */
.home {
  position: absolute;
  inset: 0;
  padding: 20px;
  display: none;
  flex-direction: column;
}
.header {
  text-align: center;
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.app {
  background: linear-gradient(145deg,#0b1020,#020617);
  border-radius: 22px;
  padding: 24px;
  text-align: center;
  font-size: 16px;
  box-shadow: 0 25px 60px rgba(0,0,0,.6);
  transition: transform .2s ease;
}
.app:active {
  transform: scale(0.95);
}
.footer {
  margin-top: auto;
  text-align: center;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div class="lock" id="lock">
  <div class="time" id="time"></div>
  <div class="unlock">Tap anywhere to unlock</div>
</div>

<!-- HOME SCREEN -->
<div class="home" id="home">
  <div class="header">
    <h2>NVIEL</h2>
    <div style="font-size:13px;opacity:.6">
      Outcome-based OS
    </div>
  </div>

  <div class="grid">
    <div class="app" onclick="openApp('Call')">📞 Call</div>
    <div class="app" onclick="openApp('Travel')">✈️ Travel</div>
    <div class="app" onclick="openApp('Finance')">💸 Finance</div>
    <div class="app" onclick="openApp('Focus')">🎯 Focus</div>
  </div>

  <div class="footer">
    Built with vision, not money
  </div>
</div>

<script>
const lock = document.getElementById("lock");
const home = document.getElementById("home");
const timeEl = document.getElementById("time");

function updateTime(){
  timeEl.innerText = new Date().toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
  });
}
setInterval(updateTime, 1000);
updateTime();

lock.onclick = () => {
  lock.style.opacity = 0;
  setTimeout(() => {
    lock.style.display = "none";
    home.style.display = "flex";
  }, 500);
};

function openApp(name){
  alert(name + " outcome activated 🚀");
}
</script>

</body>
</html>
