<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVIEL OS</title>

<style>
body{
  margin:0;
  background:#020617;
  color:#e5e7eb;
  font-family:system-ui;
  height:100vh;
  overflow:hidden;
}
.status{
  height:32px;
  padding:0 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#94a3b8;
}
.home{
  padding:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.app{
  text-align:center;
  font-size:12px;
}
.icon{
  width:58px;
  height:58px;
  border-radius:18px;
  background:linear-gradient(145deg,#1e293b,#020617);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin:auto;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.05),
    0 10px 25px rgba(0,0,0,0.6);
  transition:transform .15s ease, box-shadow .15s ease;
}

.app:active .icon{
  transform:scale(0.9);
  box-shadow:0 5px 10px rgba(0,0,0,0.8);
}
.ai{
  position:absolute;
  bottom:110px;
  left:18px;
  right:18px;
}
input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#020617;
  color:white;
}
</style>
</head>

<body>

<div class="status">
  <div id="time"></div>
  <div>NVIEL • 5G</div>
</div>

<div class="home">
  <div class="app" onclick="openApp('call')"><div class="icon">📞</div>Call</div>
  <div class="app" onclick="openApp('travel')"><div class="icon">✈️</div>Travel</div>
  <div class="app" onclick="openApp('finance')"><div class="icon">💸</div>Pay</div>
  <div class="app" onclick="openApp('focus')"><div class="icon">🎯</div>Focus</div>
</div>

<div class="ai">
  <input id="q" placeholder="Ask NVIEL…" onkeydown="if(event.key==='Enter')ask()" />
</div>

<script src="/core.js"></script>

<script>
function openApp(intent){
  const s = NVIEL.launch(intent);
  alert(intent.toUpperCase()+" | CPU "+s.cpu+"% | Mode "+s.mode);
}

async function ask(){
  const q = document.getElementById("q").value;
  const r = await fetch("/api/ai",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ text:q })
  });
  const d = await r.json();
  openApp(d.intent);
}

setInterval(()=>{
  document.getElementById("time").innerText =
    new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
},1000);
</script>

</body>
</html>
